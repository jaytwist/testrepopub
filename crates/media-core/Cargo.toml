[package]
name = "media-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5"
czkawka_core = "12.0.2"
dunce = "1.0.5"
filetime = "0.2.29"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "rayon"] }
imagesize = "0.15.0"
log = "0.4.35"
nom-exif = "3.8.0"
once_cell = "1.21.4"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

# AI runtime: ONNX Runtime is loaded at run time from the DLL/.so we ship (load-dynamic),
# API pinned to 1.24 because that is the last ONNX Runtime release with DirectML.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
jpeg-decoder = "0.3"

[target.'cfg(windows)'.dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "load-dynamic", "api-24", "directml"]

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Power"] }
