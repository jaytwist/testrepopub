[workspace]
resolver = "2"
members = ["crates/media-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# czkawka_core and image decoding are slow in debug builds; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 2
